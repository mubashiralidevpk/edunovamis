<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Edunova</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        background: #0C0E14; color: #e6e9f2;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .box { text-align: center }
      .ring {
        width: 46px; height: 46px; margin: 0 auto 18px;
        border: 3px solid rgba(255,255,255,.12);
        border-top-color: #4da3ff; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg) } }
      p { font-size: 14px; opacity: .7 }
      b { letter-spacing: .5px }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="ring"></div>
      <b>Edunova</b>
      <p>Connecting…</p>
    </div>
    <script>
      // Offline fallback: retry the live platform when a connection returns.
      setTimeout(function () {
        location.replace('https://edunovamis.lovable.app/auth/login?mobile=1');
      }, 2500);
    </script>
  </body>
</html>
