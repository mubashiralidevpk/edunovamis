name: Build Edunova Mobile (Android)

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add camera and location permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.CAMERA" \
            "android.permission.ACCESS_FINE_LOCATION" \
            "android.permission.ACCESS_COARSE_LOCATION"
          do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "/<\/manifest>/i\\    <uses-permission android:name=\"$PERM\" />" "$MANIFEST"
            fi
          done
          if ! grep -q 'android.hardware.camera' "$MANIFEST"; then
            sed -i "/<\/manifest>/i\\    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />" "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease || true

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Edunova_1.0.0.apk
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/Edunova_1.0.0_release-unsigned.apk
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: edunova-android
          path: out/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'mobile' }}
          name: Edunova Mobile ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          body: 'Android build of the Edunova app. Install the APK on Android 9 or newer.'
          files: out/*
